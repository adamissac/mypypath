name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local HTML links
        run: python scripts/check_links.py
      - name: Verify no Certifications footguns
        run: |
          grep -q "Capstone Project" scripts/bake_layout.py
          ! grep -q "Certification Prep" scripts/bake_layout.py
          ! grep -q certifications.html scripts/bake_layout.py
          ! grep -q certifications.html fix_navigation.py
          ! grep -q 'certifications.html" class="route">Certifications' scripts/upgrade_site.py
      - name: Check meta descriptions
        run: python scripts/check_meta.py
      - name: Classroom script tags are current on every page
        run: python3 scripts/add_classroom_scripts.py --check

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Curriculum manifest is current
        run: |
          npm run build:curriculum
          git diff --exit-code assets/data/curriculum.json
      - name: Check files are valid
        run: npm run validate:checks
      - name: Unit tests
        run: npm test
      - name: Firestore rules tests
        run: npm run test:rules

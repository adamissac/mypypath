name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check local HTML links
        run: python scripts/check_links.py
      - name: Verify no Certifications footguns
        run: |
          grep -q "Capstone Project" scripts/bake_layout.py
          ! grep -q "Certification Prep" scripts/bake_layout.py
          ! grep -q certifications.html scripts/bake_layout.py
          ! grep -q certifications.html fix_navigation.py
          ! grep -q 'certifications.html" class="route">Certifications' scripts/upgrade_site.py
      - name: Check meta descriptions
        run: python scripts/check_meta.py

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install exercise test dependencies
        run: python -m pip install numpy==2.0.2 pandas==2.3.3
      - run: npm ci
      - name: Unit tests
        run: npm test

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Firestore rules tests
        run: npm run test:rules

  teacher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Teacher actions against Auth and Firestore emulators
        run: npm run test:teacher

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: [a11y, mobile, keyboard, motion, perf]
    name: Browser / ${{ matrix.gate }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser gate
        run: npm run test:${{ matrix.gate }}

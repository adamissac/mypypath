<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .wind-track { animation: wind-dash 30s linear infinite; }
      .cloud-a { animation: cloud-drift 9s ease-in-out infinite alternate; }
      .cloud-b { animation: cloud-drift 12s ease-in-out -4s infinite alternate-reverse; }
      .summit-flag { transform-origin: 300px 120px; animation: flag-wave 2.4s ease-in-out infinite; }
      .trail-flow { animation: trail-flow 6s linear infinite; }
      .falls { animation: falls-flow 1.4s linear infinite; }
      .sparkles { animation: sparkle 5s ease-in-out infinite alternate; }
      .birds { animation: birds-glide 14s ease-in-out infinite alternate; }
    }
    @keyframes wind-dash { to { stroke-dashoffset: -240; } }
    @keyframes cloud-drift { to { transform: translateX(16px); } }
    @keyframes flag-wave { 50% { transform: skewY(-6deg) scaleX(0.92); } }
    @keyframes trail-flow { to { stroke-dashoffset: -110; } }
    @keyframes falls-flow { to { stroke-dashoffset: -24; } }
    @keyframes sparkle { from { opacity: .35; } to { opacity: 1; } }
    @keyframes birds-glide { to { transform: translate(-18px, 6px); } }
  </style>
  <title>The Summit: Python Foundations, stops 1 through 10</title>
  <g id="scene" transform="translate(320 320) scale(1.2) translate(-320 -354)">

  <!-- A broken wind track behind the island, like the moon's orbit. -->
  <ellipse class="wind-track" cx="320" cy="334" rx="262" ry="86" transform="rotate(-12 320 330)" stroke="#7fb0cf" stroke-width="1.2" stroke-dasharray="3 9" opacity=".7"/>
  <g class="sparkles" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round">
    <path d="M92 236 h12 m-6 -6 v12 M548 262 h10 m-5 -5 v10 M118 518 h14 m-7 -7 v14 M520 528 h10 m-5 -5 v10"/>
  </g>
  <path d="M568 196 l3 -8 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3Z" fill="#0ea5e9"/>

  <!-- Clouds: flat, two tones. -->
  <g class="cloud-a">
    <path d="M70 196 a22 22 0 0 1 30 -26 a30 30 0 0 1 54 4 a20 20 0 0 1 26 22Z" fill="#ffffff"/>
    <path d="M70 196 h110 a10 10 0 0 1 -6 8 h-98 a10 10 0 0 1 -6 -8Z" fill="#d0e4ef"/>
  </g>
  <g class="cloud-b">
    <path d="M462 140 a18 18 0 0 1 26 -20 a26 26 0 0 1 46 4 a17 17 0 0 1 22 16Z" fill="#ffffff"/>
    <path d="M462 140 h94 a9 9 0 0 1 -5 7 h-84 a9 9 0 0 1 -5 -7Z" fill="#d0e4ef"/>
  </g>
  <g class="birds" stroke="#0c4566" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M412 96 l8 6 8 -6 M440 112 l6 5 6 -5"/>
  </g>

  <g id="island">
  <!-- Underside: solid facets tapering to a point, no gradients. -->
  <path d="M106 424 L534 424 L470 488 L404 556 L334 612 L256 552 L176 492Z" fill="#11506f"/>
  <path d="M106 424 L250 436 L256 552 L176 492Z" fill="#165a7a"/>
  <path d="M250 436 L392 438 L334 612 L256 552Z" fill="#165a7a"/>
  <path d="M392 438 L534 424 L470 488 L404 556 L334 612Z" fill="#0c4566"/>
  <path d="M176 492 L256 552 L240 520Z M404 556 L470 488 L430 500Z" fill="#0a3a57"/>
  <path d="M300 470 L334 612 L318 500Z" fill="#165a7a" opacity=".7"/>

  <!-- Waterfall off the lake's edge. -->
  <path class="falls" d="M482 432 V560 M490 432 V548 M498 432 V538" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 6"/>

  <!-- The island top: a pale meadow with a darker cliff edge. -->
  <ellipse cx="320" cy="428" rx="216" ry="46" fill="#a8d0e8"/>
  <ellipse cx="320" cy="418" rx="216" ry="44" fill="#e8f4fb"/>
  <ellipse cx="452" cy="428" rx="40" ry="10" fill="#0ea5e9"/>
  <path d="M430 425 h22 M458 431 h14" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>

  <!-- Back peaks, then the summit: each a lit face and a shaded face. -->
  <path d="M112 410 L186 286 L252 410Z" fill="#a8d0e8"/>
  <path d="M186 286 L252 410 L208 410Z" fill="#7fb0cf"/>
  <path d="M376 408 L440 214 L540 408Z" fill="#4078a0"/>
  <path d="M440 214 L540 408 L456 408Z" fill="#2b6a8f"/>
  <path d="M440 214 L456 246 L446 252 L438 242 L428 254 L422 242Z" fill="#f3f9fc"/>
  <path d="M140 410 L300 126 L318 410Z" fill="#7fb0cf"/>
  <path d="M300 126 L470 406 L318 410Z" fill="#165a7a"/>
  <path d="M300 126 L318 410 L360 300Z" fill="#2b6a8f"/>
  <path d="M222 266 L300 126 L262 300Z" fill="#a8d0e8"/>
  <!-- Snow cap. -->
  <path d="M300 126 L340 194 L326 204 L314 194 L302 214 L288 197 L272 208 L262 194Z" fill="#f3f9fc"/>
  <path d="M300 126 L340 194 L326 204 L314 194 L302 214Z" fill="#d0e4ef"/>

  <!-- Pines. -->
  <g>
    <path d="M150 412 L162 382 L174 412Z M170 414 L184 378 L198 414Z M466 412 L478 384 L490 412Z M490 416 L503 386 L516 416Z M232 414 L242 390 L252 414Z M398 414 L408 392 L418 414Z" fill="#165a7a"/>
    <path d="M162 382 L174 412 L162 412Z M184 378 L198 414 L184 414Z M478 384 L490 412 L478 412Z M503 386 L516 416 L503 416Z M242 390 L252 414 L242 414Z M408 392 L418 414 L408 414Z" fill="#0c4566"/>
  </g>

  <!-- Cabin at the trailhead. -->
  <g transform="translate(206 418)">
    <path d="M-16 0 V-14 H16 V0Z" fill="#e8f4fb"/>
    <path d="M-20 -14 L0 -28 L20 -14Z" fill="#0c4566"/>
    <path d="M-6 0 V-8 H2 V0Z" fill="#165a7a"/><path d="M6 -10 h6 v5 h-6Z" fill="#f2bc63"/>
  </g>

  <!-- The trail: a flat sky-blue ribbon with a solid offset shadow, like the moon's. -->
  <path d="M226 424 C260 430 290 434 316 432 S398 424 396 412 S352 392 332 384 S256 370 250 356 S286 326 304 318 S356 300 352 284 S300 262 292 250 S322 214 320 202 S302 166 300 150" transform="translate(0 3)" stroke="#0c4566" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M226 424 C260 430 290 434 316 432 S398 424 396 412 S352 392 332 384 S256 370 250 356 S286 326 304 318 S356 300 352 284 S300 262 292 250 S322 214 320 202 S302 166 300 150" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="trail-flow" d="M226 424 C260 430 290 434 316 432 S398 424 396 412 S352 392 332 384 S256 370 250 356 S286 326 304 318 S356 300 352 284 S300 262 292 250 S322 214 320 202 S302 166 300 150" stroke="#e0f2fe" stroke-width="1.4" stroke-dasharray="1 10" stroke-linecap="round"/>

  <!-- Stops 1-10. -->
  <g font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">
    <g transform="translate(246 427)"><circle cy="3" r="12" fill="#082f49"/><circle r="12" fill="#0c4566" stroke="#0ea5e9" stroke-width="2"/><text y="4" fill="#f0f9ff">1</text></g>
    <g transform="translate(316 432)"><circle cy="3" r="12" fill="#082f49"/><circle r="12" fill="#0c4566" stroke="#0ea5e9" stroke-width="2"/><text y="4" fill="#f0f9ff">2</text></g>
    <g transform="translate(396 412)"><circle cy="3" r="12" fill="#082f49"/><circle r="12" fill="#0c4566" stroke="#0ea5e9" stroke-width="2"/><text y="4" fill="#f0f9ff">3</text></g>
    <g transform="translate(332 384)"><circle cy="3" r="12" fill="#082f49"/><circle r="12" fill="#0c4566" stroke="#0ea5e9" stroke-width="2"/><text y="4" fill="#f0f9ff">4</text></g>
    <g transform="translate(250 356)"><circle cy="3" r="12" fill="#082f49"/><circle r="12" fill="#0c4566" stroke="#0ea5e9" stroke-width="2"/><text y="4" fill="#f0f9ff">5</text></g>
    <g transform="translate(304 318)"><circle cy="3" r="12" fill="#082f49"/><circle r="12" fill="#0c4566" stroke="#0ea5e9" stroke-width="2"/><text y="4" fill="#f0f9ff">6</text></g>
    <g transform="translate(352 284)"><circle cy="3" r="12" fill="#082f49"/><circle r="12" fill="#0c4566" stroke="#0ea5e9" stroke-width="2"/><text y="4" fill="#f0f9ff">7</text></g>
    <g transform="translate(292 250)"><circle cy="3" r="12" fill="#082f49"/><circle r="12" fill="#0c4566" stroke="#0ea5e9" stroke-width="2"/><text y="4" fill="#f0f9ff">8</text></g>
    <g transform="translate(320 202)"><circle cy="3" r="12" fill="#082f49"/><circle r="12" fill="#0c4566" stroke="#0ea5e9" stroke-width="2"/><text y="4" fill="#f0f9ff">9</text></g>
    <g transform="translate(300 152)"><circle r="23" fill="#0ea5e9" fill-opacity=".14"/><circle r="22" stroke="#0ea5e9" stroke-width="1"/><circle cy="3" r="12" fill="#082f49"/><circle r="12" fill="#0ea5e9" stroke="#e0f2fe" stroke-width="2"/><text y="4" fill="#082f49">10</text></g>
  </g>

  <!-- Summit flag. -->
  <g class="summit-flag" stroke-linejoin="round"><path d="M300 130 V96 L328 105 L300 115" fill="#0ea5e9" stroke="#0c4566" stroke-width="2"/><path d="M303 99 L318 105 L303 110Z" fill="#bae6fd"/></g>

  </g>

  <!-- A small floating rock off the main island. -->
  <g class="islet">
    <path d="M70 536 L136 536 L120 566 L104 588 L88 566Z" fill="#11506f"/>
    <path d="M70 536 L100 540 L88 566Z" fill="#165a7a"/>
    <path d="M100 540 L136 536 L120 566Z" fill="#0c4566"/>
    <ellipse cx="103" cy="534" rx="35" ry="8" fill="#e8f4fb"/>
    <path d="M96 534 L103 512 L110 534Z" fill="#165a7a"/><path d="M103 512 L110 534 L103 534Z" fill="#0c4566"/>
  </g>

  <g stroke="#7fb0cf" stroke-width="1" opacity=".7"><path d="M257 628 h30 m66 0 h30"/><circle cx="320" cy="628" r="3"/></g>
  </g>
</svg>
